<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Clon</title>
        <style>

            body {
                font-family: 'Roboto', sans-serif;
                background-color: #141414;
                background-size: cover;
                color: #efeded;
                margin: 0;
                padding: 0;
            }

            .container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
            }

            .logo {
                font-size: 60px;
                font-weight: bold;
                margin-bottom: 16px;
                color:#e50914
            }

            .login-box {
                background-color: rgba(0, 0, 0, 0.75);
                padding: 30px;
                border-radius: 8px;
                width: 300px;
            }

            .login-box h2 {
                margin-bottom: 16px;
            }

            .form-group {
                margin-bottom: 16px;
            }

            .form-group input[type="text"],
            .form-group input[type="password"] {
                width: 100%;
                padding: 0.5px;
                border-radius: 4px;
                border: none;
            }

            button {
                width: 100%;
                padding: 0.75px;
                background-color: #e50914;
                color: #e4e1e1;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            button:hover {
                background-color: #f40612;
            }       
        </style>
    </head>
    <body>
        <!-- container -->
        <div class="container">
        <!--logo-->
        <h1 class="logo">NETFLIX</h1>
        <!--login box-->
        <div class="login-box">
            <h2>Sign In </h2>
            <form>
                <div class="form group">
                    <input type="text" id="email" name="email" placeholder="Email or phone number">
                </div>
                <div class="form group">
                    <input type="password" id="password" name="password" placeholder="Password">
                </div>
                <div class="form group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
                <button type="submit">Sign In</button>

            </form>
        </div>

    </body> 
</html>
