<!DOCTYPE html>
<head>
    <title> login page</title>
</head>
<style>
    body{
        background-color: aqua;
        background: radial-gradient(circle,rgba(182, 210, 220, 0.99) 63%, rgba(148, 187, 233, 1) 39%);
background-repeat: no-repeat;
background-size: cover;
min-height: 100vh;
font-family: Arial, Helvetica, sans-serif;
font-size: 16px;
font-weight: normal;
margin: 0;
}  
    .login-container{
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items:center;
    
    }
    .login-box{
        width: 350px;
        padding: 35px;
        margin: 20px;
        border-style: groove;
        border-width: 2px;
        border-color:rgb(26, 189, 235);
        border-radius: 10px;

            box-shadow: 0 0 20px rgb(4, 169, 195);
        }
    h1{
        color:#333;
        text-align: center;
        text-transform: capitalize;
        letter-spacing: 1px;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        font-size: 30px;
        font-weight: bold;
        font-style: normal;
        margin-bottom: 10px;
    }
    .subtitle{
        color: rgb(40, 143, 240);
        text-align: center;
        font-size: 15px;
        font-weight: normal;
        line-height: 1.5;
        margin-bottom: 30px;
    }
    .form-group{
        
        margin-bottom:20px;

    }
    .form-group label{
        display: block;
        color: rgb(19, 20, 20);
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 8px;
    }
    .form-group input{
        width: 100%;
        padding: 12px;
        box-sizing: border-box;
        background-color: rgb(247, 246, 246);
        border: 2px solid rgb(11, 174, 219);
        border-radius: 6px;
        font-size: 14px;
        color: rgb(31, 152, 192);
        
    }
    

    .options{
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        font-size: 13px;
    

    }
    a.hover{
        text-decoration: underline;
    }
    button{
        width: 100%;
        padding: 13px;
        background-color:rgb(235, 237, 237);
        color:#070707;
        cursor: pointer;
         border: 2px solid #1cc4e1;

    }
    button:hover{
        color: white;
        background-color: #1cc4e1;
        border: 2px solid rgb(19, 161, 222);
    }
    .register{
        text-align: center;

        color: black;
        margin-top: 25px;

    }
</style>
<body>
    <div class="login-container">
        <div class="login-box">
        <h1>Welcome back!</h1>
        <p class="subtitle">Login  your account</p>
        <form>
            <div class="form-group">
                <label> Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="enter your password" required>
            </div>
            <div class="options">
                <label>
                    <input type="checkbox"> Remember Me
                    <a href="#">forget password</a>
                </label>
            </div>
            <button type="submit">Login</button>
            <p class="register">don't have a account?
                <a href="#"> Register Now</a>
            </p>
        </form>
        
    </div>
    </div>
</body>
